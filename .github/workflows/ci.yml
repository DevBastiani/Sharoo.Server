name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Inject JWT secret into appsettings.json
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          sed -i "s|\"Secret\": \"\"|\"Secret\": \"$JWT_SECRET\"|g" \
            API/Sharoo.Server.API/appsettings.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build
